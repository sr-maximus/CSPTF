name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/validate_catalogs.py
      - run: python -m unittest discover -s tests
      - run: python tools/generate_checklist.py --profile AP2 --output build/checklist-ap2.csv
      - run: python tools/generate_evidence_matrix.py --profile AP2 --output build/evidence-matrix-ap2.csv
