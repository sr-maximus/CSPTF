[project]
name = "csptf"
version = "0.1.0"
description = "Catalog tooling for the Crypto Security Penetration Testing Framework"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Edwin Javier Peñuela Camacho"}]
dependencies = ["jsonschema>=4.20,<5", "PyYAML>=6,<7"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
